<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quote Calculator &mdash; Billing & Tariff Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
    renderAppShell({
        service: 'Pricing',
        page: 'Quote',
        tabs: [
            { href: '/ui/billing/index.html', label: 'Overview' },
            { href: '/ui/billing/schedules.html', label: 'PriceLists' },
            { href: '/ui/billing/adjustments.html', label: 'Discounts' },
            { href: '/ui/billing/estimate.html', label: 'Quote' }
        ]
    });
</script>

<main class="page">
    <div class="toolbar">
        <h2>Price Quote</h2>
    </div>

    <div style="margin-top: 2rem;">
        <div style="background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 8px; max-width: 480px;">
            <form id="quote-form">
                <div class="form-group">
                    <label for="quote-tier">ProtectionScheme Tier</label>
                    <input type="text" id="quote-tier" value="DEFAULT" required>
                </div>
                <div class="form-group">
                    <label for="quote-sku">SKU</label>
                    <select id="quote-sku" required>
                        <option value="">Loading SKUs…</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quote-qty">Quantity</label>
                    <input type="number" id="quote-qty" step="0.01" min="0.01" value="1" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-accent" data-permission="price.quote">QUOTE</button>
                </div>
            </form>
        </div>

        <div id="result-panel" style="display:none; margin-top: 2rem;">
            <div style="background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 8px; max-width: 480px;">
                <h3 style="border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem;">Quote Result</h3>
                <div id="result-content"></div>
            </div>
        </div>

        <div id="error-msg" style="display:none; margin-top: 1rem; padding: 1rem; background: var(--error-bg); color: var(--error); border-radius: 8px; font-family: var(--mono); font-size: 12px;"></div>
    </div>
</main>

<script>
    async function loadSKUs() {
        try {
            const [catalogRes, salesRes] = await Promise.all([
                apiFetch('/asset/units').catch(() => ({ok: false})),
                apiFetch('/protection/skus').catch(() => ({ok: false}))
            ]);
            
            let skus = [];
            if (catalogRes.ok) {
                skus = await catalogRes.json();
            } else if (salesRes.ok) {
                skus = await salesRes.json();
            }
            
            const select = document.getElementById('quote-sku');
            select.innerHTML = '<option value="">Select SKU…</option>';
            skus.forEach(sku => {
                const option = document.createElement('option');
                option.value = sku.id;
                option.textContent = `${sku.skuCode || sku.id} - ${sku.name || 'SKU'}`;
                select.appendChild(option);
            });
        } catch(e) {
            console.error('Failed to load SKUs:', e);
            alertModal({title: 'Failed to load SKUs'});
        }
    }

    document.getElementById('quote-form').addEventListener('submit', async e => {
        e.preventDefault();
        
        const errorDiv = document.getElementById('error-msg');
        errorDiv.style.display = 'none';
        const resultPanel = document.getElementById('result-panel');
        resultPanel.style.display = 'none';
        
        const body = {
            customerTier: document.getElementById('quote-tier').value,
            skuId: parseInt(document.getElementById('quote-sku').value),
            qty: parseFloat(document.getElementById('quote-qty').value)
        };

        try {
            const res = await apiFetch('/billing/estimate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            
            if (!res || !res.ok) {
                const errText = await res.text().catch(() => 'Unknown error');
                throw new Error(errText);
            }
            
            const data = await res.json();
            const resultDiv = document.getElementById('result-content');
            
            resultDiv.innerHTML = `
                <div style="display: grid; grid-template-columns: auto 1fr; gap: 0.5rem 1rem; font-family: var(--mono); font-size: 13px;">
                    <div style="color: var(--muted);">ProtectionScheme Tier:</div>
                    <div>${data.customerTier}</div>
                    
                    <div style="color: var(--muted);">Price List:</div>
                    <div>${data.priceListCode || '&mdash;'}</div>
                    
                    <div style="color: var(--muted);">SKU:</div>
                    <div>${data.skuId}</div>
                    
                    <div style="color: var(--muted);">Quantity:</div>
                    <div>${data.qty}</div>
                    
                    <div style="color: var(--muted);">Unit Price:</div>
                    <div>${data.currency} ${parseFloat(data.unitPrice).toFixed(2)}</div>
                    
                    <div style="color: var(--muted); border-top: 1px solid var(--border); padding-top: 0.5rem; margin-top: 0.5rem;">Subtotal:</div>
                    <div style="border-top: 1px solid var(--border); padding-top: 0.5rem; margin-top: 0.5rem;">${data.currency} ${parseFloat(data.lineSubtotal).toFixed(2)}</div>
                    
                    ${data.discountCode ? `
                    <div style="color: var(--success);">RateAdjustment (${data.discountCode}):</div>
                    <div style="color: var(--success);">-${data.currency} ${parseFloat(data.discountAmount).toFixed(2)}</div>
                    ` : `
                    <div style="color: var(--muted);">RateAdjustment:</div>
                    <div>&mdash;</div>
                    `}
                    
                    <div style="color: var(--muted); font-weight: bold; border-top: 2px solid var(--border); padding-top: 0.5rem; margin-top: 0.5rem;">Line Total:</div>
                    <div style="font-weight: bold; font-size: 16px; border-top: 2px solid var(--border); padding-top: 0.5rem; margin-top: 0.5rem;">${data.currency} ${parseFloat(data.lineTotal).toFixed(2)}</div>
                </div>
            `;
            
            resultPanel.style.display = 'block';
        } catch(e) {
            errorDiv.textContent = e.message || 'Failed to get quote';
            errorDiv.style.display = 'block';
        }
    });

    loadSKUs();
</script>
</body>
</html>
