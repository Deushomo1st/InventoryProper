spring.application.name=ApiGateway
# Server
server.port=9000

# Force UTF-8 on all responses (otherwise static HTML serves as Latin-1 and × @ etc. mojibake)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT
security.jwt.secret=${INVENTORY_JWT_SECRET}
security.jwt.expiry-minutes=60

# Service URLs
services.auth.url=http://localhost:9001
services.catalog.url=http://localhost:9002
services.inventory.url=http://localhost:9003
services.warehouse.url=http://localhost:9004
services.supplier.url=http://localhost:9005
services.procurement.url=http://localhost:9006
services.sales.url=http://localhost:9007
services.movement.url=http://localhost:9008
services.receiving.url=http://localhost:9009
services.fulfillment.url=http://localhost:9010
services.replenishment.url=http://localhost:9011
services.audit.url=http://localhost:9012
services.uom.url=http://localhost:9013
services.notification.url=http://localhost:9014
services.reporting.url=http://localhost:9015
services.pricing.url=http://localhost:9016
