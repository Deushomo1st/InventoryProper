spring.application.name=DocumentManagementService
server.port=9005

# Force UTF-8 on all responses (otherwise static HTML serves as Latin-1 and × @ etc. mojibake)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ElectDeptSoftware
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=document

services.auth.url=http://localhost:9001

