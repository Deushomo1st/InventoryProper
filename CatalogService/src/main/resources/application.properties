spring.application.name=CatalogService
server.port=9002

# Force UTF-8 on all responses (otherwise static HTML serves as Latin-1 and ?? @ etc. mojibake)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_deus
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog

services.auth.url=http://localhost:9001

# JWT
security.jwt.secret=${INVENTORY_JWT_SECRET}
security.jwt.expiry-minutes=60