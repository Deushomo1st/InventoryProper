<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zones &mdash; Substation Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
    renderAppShell({
        service: 'Substation Service',
        page: 'Zones',
        tabs: [
            { href: '/ui/gis/index.html', label: 'Overview' },
            { href: '/ui/gis/substations.html', label: 'Warehouses' },
            { href: '/ui/gis/feeders.html', label: 'Zones' },
            { href: '/ui/gis/poles.html', label: 'Bins' }
        ]
    });
</script>

<main class="page">
    <div class="toolbar">
        <h2>Zones</h2>
        <input type="text" id="zone-search" class="search-input" placeholder="Search by warehouse, code, name, or type&hellip;" autocomplete="off">
        <div class="actions">
            <button class="btn-accent" onclick="showCreateModal()">+ NEW ZONE</button>
        </div>
    </div>

    <table class="data-table" id="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Substation</th>
            <th>Code</th>
            <th>Name</th>
            <th>Type</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</main>

<div class="modal-back" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-x" onclick="closeModal()">&times;</button>
        <div class="modal-tag" id="modal-tag">New</div>
        <div class="modal-title" id="modal-title">Create Feeder</div>
        <form id="form">
            <input type="hidden" id="zone-id">
            <div class="form-group">
                <label for="zone-warehouse">Substation</label>
                <select id="zone-warehouse" required></select>
            </div>
            <div class="form-group">
                <label for="zone-code">Code</label>
                <input type="text" id="zone-code" required>
            </div>
            <div class="form-group">
                <label for="zone-name">Name</label>
                <input type="text" id="zone-name" required>
            </div>
            <div class="form-group">
                <label for="zone-type">Feeder Type</label>
                <select id="zone-type" required>
                    <option value="RECEIVING">RECEIVING</option>
                    <option value="BULK">BULK</option>
                    <option value="PICK_FACE">PICK_FACE</option>
                    <option value="COLD_STORAGE">COLD_STORAGE</option>
                </select>
            </div>
            <div class="form-row">
                <input type="checkbox" id="zone-active" checked>
                <label for="zone-active">Active</label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-ghost" onclick="closeModal()">CANCEL</button>
                <button type="submit" class="btn-accent">SAVE</button>
            </div>
        </form>
    </div>
</div>

<script>
    let allZones = [];
    let allWarehouses = [];

    async function load() {
        try {
            const res = await apiFetch('/gis/feeders');
            if (!res) return;
            allZones = await res.json();
            renderZones();
        } catch (err) {
            console.error(err);
        }
    }

    async function loadWarehouses(selectedId) {
        try {
            const res = await apiFetch('/gis/substations');
            if (!res) return;
            allWarehouses = await res.json();
            const sel = document.getElementById('zone-warehouse');
            sel.innerHTML = '<option value="">Select</option>';
            allWarehouses.forEach(w => {
                sel.innerHTML += `<option value="${w.id}" ${w.id === selectedId ? 'selected' : ''}>${w.code} (${w.name})</option>`;
            });
        } catch (err) {
            console.error(err);
        }
    }

    function renderZones() {
        const q = (document.getElementById('zone-search').value || '').trim().toLowerCase();
        const filtered = q
            ? allZones.filter(z =>
                (z.warehouseName || '').toLowerCase().includes(q) ||
                (z.code || '').toLowerCase().includes(q) ||
                (z.name || '').toLowerCase().includes(q) ||
                (z.zoneType || '').toLowerCase().includes(q))
            : allZones;
        const tbody = document.getElementById('tbody');
        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 32px; color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 1px;">${q ? 'No zones match "' + q + '"' : 'No zones yet'}</td></tr>`;
            return;
        }
        tbody.innerHTML = filtered.map(z => `
        <tr>
          <td>${z.id}</td>
          <td>${z.warehouseName}</td>
          <td>${z.code}</td>
          <td>${z.name}</td>
          <td>${z.zoneType}</td>
          <td><span class="pill ${z.active ? 'active' : 'inactive'}">${z.active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <div class="row-actions">
              <button class="action-link" onclick="editZone(${z.id})">Edit</button>
              <button class="action-link danger" onclick="deleteZone(${z.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function showCreateModal() {
        document.getElementById('modal-title').textContent = 'Create Feeder';
        document.getElementById('modal-tag').textContent = 'New';
        document.getElementById('form').reset();
        document.getElementById('zone-id').value = '';
        document.getElementById('zone-active').checked = true;
        loadWarehouses(null);
        document.getElementById('modal').classList.add('show');
    }

    async function editZone(id) {
        try {
            const res = await apiFetch(`/gis/feeders/${id}`);
            if (!res) return;
            const z = await res.json();
            document.getElementById('modal-title').textContent = 'Edit Feeder';
            document.getElementById('modal-tag').textContent = 'Edit';
            document.getElementById('zone-id').value = z.id;
            document.getElementById('zone-code').value = z.code;
            document.getElementById('zone-name').value = z.name;
            document.getElementById('zone-type').value = z.zoneType;
            document.getElementById('zone-active').checked = z.active;
            loadWarehouses(z.warehouseId);
            document.getElementById('modal').classList.add('show');
        } catch (err) {
            console.error(err);
            alertModal({ title: 'Failed to load zone' });
        }
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }
    document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.getElementById('form').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('zone-id').value;
        const body = {
            warehouseId: parseInt(document.getElementById('zone-warehouse').value),
            code: document.getElementById('zone-code').value,
            name: document.getElementById('zone-name').value,
            zoneType: document.getElementById('zone-type').value,
            active: document.getElementById('zone-active').checked
        };

        try {
            const url = id ? `/gis/feeders/${id}` : '/gis/feeders';
            const method = id ? 'PUT' : 'POST';
            const res = await apiFetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res || !res.ok) {
                const err = await res.json().catch(() => ({}));
                alertModal({ title: 'Failed to save zone', body: err.message });
                return;
            }
            closeModal();
            load();
        } catch (err) {
            console.error(err);
            alertModal({ title: 'Failed to save zone' });
        }
    });

    function deleteZone(id) {
        confirmDanger({
            title: 'Delete zone?',
            body: 'This is permanent. All bins in this zone will also be deleted.',
            confirmLabel: 'DELETE',
            onConfirm: async () => {
                try {
                    const res = await apiFetch(`/gis/feeders/${id}`, { method: 'DELETE' });
                    if (!res) return;
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        alertModal({ title: 'Failed to delete zone', body: err.message });
                        return;
                    }
                    load();
                } catch (err) {
                    console.error(err);
                    alertModal({ title: 'Failed to delete zone' });
                }
            }
        });
    }

    load();
    document.getElementById('zone-search').addEventListener('input', renderZones);
</script>
</body>
</html>
