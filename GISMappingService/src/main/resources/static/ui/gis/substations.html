<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warehouses &mdash; Substation Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
    renderAppShell({
        service: 'Substation Service',
        page: 'Warehouses',
        tabs: [
            { href: '/ui/gis/index.html', label: 'Overview' },
            { href: '/ui/gis/substations.html', label: 'Warehouses' },
            { href: '/ui/gis/feeders.html', label: 'Zones' },
            { href: '/ui/gis/poles.html', label: 'Bins' }
        ]
    });
</script>

<main class="page">
    <div class="toolbar">
        <h2>Warehouses</h2>
        <input type="text" id="warehouse-search" class="search-input" placeholder="Search by code, name, or address&hellip;" autocomplete="off">
        <div class="actions">
            <button class="btn-accent" onclick="showCreateModal()">+ NEW WAREHOUSE</button>
        </div>
    </div>

    <table class="data-table" id="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Address</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</main>

<div class="modal-back" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-x" onclick="closeModal()">&times;</button>
        <div class="modal-tag" id="modal-tag">New</div>
        <div class="modal-title" id="modal-title">Create Substation</div>
        <form id="form">
            <input type="hidden" id="wh-id">
            <div class="form-group">
                <label for="wh-code">Code</label>
                <input type="text" id="wh-code" required>
                <small>Unique identifier like WH-MAIN, WH-NORTH.</small>
            </div>
            <div class="form-group">
                <label for="wh-name">Name</label>
                <input type="text" id="wh-name" required>
            </div>
            <div class="form-group">
                <label for="wh-address">Address</label>
                <input type="text" id="wh-address">
            </div>
            <div class="form-row">
                <input type="checkbox" id="wh-active" checked>
                <label for="wh-active">Active</label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-ghost" onclick="closeModal()">CANCEL</button>
                <button type="submit" class="btn-accent">SAVE</button>
            </div>
        </form>
    </div>
</div>

<script>
    let allWarehouses = [];

    async function load() {
        try {
            const res = await apiFetch('/gis/substations');
            if (!res) return;
            allWarehouses = await res.json();
            renderWarehouses();
        } catch (err) {
            console.error(err);
        }
    }

    function renderWarehouses() {
        const q = (document.getElementById('warehouse-search').value || '').trim().toLowerCase();
        const filtered = q
            ? allWarehouses.filter(w =>
                (w.code || '').toLowerCase().includes(q) ||
                (w.name || '').toLowerCase().includes(q) ||
                (w.address || '').toLowerCase().includes(q))
            : allWarehouses;
        const tbody = document.getElementById('tbody');
        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 32px; color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 1px;">${q ? 'No warehouses match "' + q + '"' : 'No warehouses yet'}</td></tr>`;
            return;
        }
        tbody.innerHTML = filtered.map(w => `
        <tr>
          <td>${w.id}</td>
          <td>${w.code}</td>
          <td>${w.name}</td>
          <td>${w.address || '&mdash;'}</td>
          <td><span class="pill ${w.active ? 'active' : 'inactive'}">${w.active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <div class="row-actions">
              <button class="action-link" onclick="editWh(${w.id})">Edit</button>
              <button class="action-link danger" onclick="deleteWh(${w.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function showCreateModal() {
        document.getElementById('modal-title').textContent = 'Create Substation';
        document.getElementById('modal-tag').textContent = 'New';
        document.getElementById('form').reset();
        document.getElementById('wh-id').value = '';
        document.getElementById('wh-active').checked = true;
        document.getElementById('modal').classList.add('show');
    }

    async function editWh(id) {
        try {
            const res = await apiFetch(`/gis/substations/${id}`);
            if (!res) return;
            const w = await res.json();
            document.getElementById('modal-title').textContent = 'Edit Substation';
            document.getElementById('modal-tag').textContent = 'Edit';
            document.getElementById('wh-id').value = w.id;
            document.getElementById('wh-code').value = w.code;
            document.getElementById('wh-name').value = w.name;
            document.getElementById('wh-address').value = w.address || '';
            document.getElementById('wh-active').checked = w.active;
            document.getElementById('modal').classList.add('show');
        } catch (err) {
            console.error(err);
            alertModal({ title: 'Failed to load warehouse' });
        }
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }
    document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.getElementById('form').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('wh-id').value;
        const body = {
            code: document.getElementById('wh-code').value,
            name: document.getElementById('wh-name').value,
            address: document.getElementById('wh-address').value || null,
            active: document.getElementById('wh-active').checked
        };

        try {
            const url = id ? `/gis/substations/${id}` : '/gis/substations';
            const method = id ? 'PUT' : 'POST';
            const res = await apiFetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res || !res.ok) {
                const err = await res.json().catch(() => ({}));
                alertModal({ title: 'Failed to save warehouse', body: err.message });
                return;
            }
            closeModal();
            load();
        } catch (err) {
            console.error(err);
            alertModal({ title: 'Failed to save warehouse' });
        }
    });

    function deleteWh(id) {
        confirmDanger({
            title: 'Delete warehouse?',
            body: 'This is permanent. All zones and bins in this warehouse will also be deleted.',
            confirmLabel: 'DELETE',
            onConfirm: async () => {
                try {
                    const res = await apiFetch(`/gis/substations/${id}`, { method: 'DELETE' });
                    if (!res) return;
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        alertModal({ title: 'Failed to delete warehouse', body: err.message });
                        return;
                    }
                    load();
                } catch (err) {
                    console.error(err);
                    alertModal({ title: 'Failed to delete warehouse' });
                }
            }
        });
    }

    load();
    document.getElementById('warehouse-search').addEventListener('input', renderWarehouses);
</script>
</body>
</html>
