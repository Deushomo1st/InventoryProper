<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories — Asset Management Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
    renderAppShell({
        service: 'Asset Management Service',
        page: 'Categories',
        tabs: [
            { href: '/ui/asset/index.html', label: 'Overview' },
            { href: '/ui/asset/classes.html', label: 'Categories' },
            { href: '/ui/asset/models.html', label: 'Products' },
            { href: '/ui/asset/units.html', label: 'SKUs' },
            { href: '/ui/asset/specs.html', label: 'Attributes' }
        ]
    });
</script>

<main class="page">
    <div class="toolbar">
        <h2>Categories</h2>
        <div class="actions">
            <button class="btn-accent" onclick="showCreateModal()">+ NEW CATEGORY</button>
        </div>
    </div>

    <table class="data-table" id="table">
        <thead>
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Parent</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</main>

<div class="modal-back" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-x" onclick="closeModal()">×</button>
        <div class="modal-tag" id="modal-tag">New</div>
        <div class="modal-title" id="modal-title">Create AssetClass</div>
        <form id="form">
            <input type="hidden" id="cat-id">
            <div class="form-group">
                <label for="cat-code">Code</label>
                <input type="text" id="cat-code" required>
            </div>
            <div class="form-group">
                <label for="cat-name">Name</label>
                <input type="text" id="cat-name" required>
            </div>
            <div class="form-group">
                <label for="cat-parent">Parent AssetClass</label>
                <select id="cat-parent">
                    <option value="">— None (root) —</option>
                </select>
            </div>
            <div class="form-row">
                <input type="checkbox" id="cat-active" checked>
                <label for="cat-active">Active</label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-ghost" onclick="closeModal()">CANCEL</button>
                <button type="submit" class="btn-accent">SAVE</button>
            </div>
        </form>
    </div>
</div>

<script>
    let allCategories = [];

    async function load() {
        try {
            const res = await apiFetch('/asset/classes');
            if (!res) return;
            allCategories = await res.json();
            render();
        } catch (err) {
            console.error(err);
        }
    }

    function flatten(nodes, depth) {
        let flat = [];
        for (const n of nodes) {
            flat.push({ ...n, depth: depth });
            if (n.children) flat = flat.concat(flatten(n.children, depth + 1));
        }
        return flat;
    }

    function render() {
        const flat = flatten(allCategories, 0);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = flat.map(c => `
      <tr>
        <td style="padding-left: ${c.depth * 20 + 12}px">${c.code}</td>
        <td>${c.name}</td>
        <td>${c.parentName || '—'}</td>
        <td><span class="pill ${c.active ? 'active' : 'inactive'}">${c.active ? 'Active' : 'Inactive'}</span></td>
        <td>
          <div class="row-actions">
            <button class="action-link" onclick="editCat(${c.id})">Edit</button>
            <button class="action-link danger" onclick="deleteCat(${c.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
    }

    function populateParentDropdown(selectedId) {
        const sel = document.getElementById('cat-parent');
        sel.innerHTML = '<option value="">— None (root) —</option>';
        const flat = flatten(allCategories, 0);
        flat.forEach(c => {
            const prefix = '\u00A0\u00A0'.repeat(c.depth);
            sel.innerHTML += `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${prefix}${c.name}</option>`;
        });
    }

    function showCreateModal() {
        document.getElementById('modal-title').textContent = 'Create AssetClass';
        document.getElementById('modal-tag').textContent = 'New';
        document.getElementById('form').reset();
        document.getElementById('cat-id').value = '';
        document.getElementById('cat-active').checked = true;
        populateParentDropdown(null);
        document.getElementById('modal').classList.add('show');
    }

    async function editCat(id) {
        try {
            const res = await apiFetch(`/asset/classes/${id}`);
            if (!res) return;
            const c = await res.json();
            document.getElementById('modal-title').textContent = 'Edit AssetClass';
            document.getElementById('modal-tag').textContent = 'Edit';
            document.getElementById('cat-id').value = c.id;
            document.getElementById('cat-code').value = c.code;
            document.getElementById('cat-name').value = c.name;
            document.getElementById('cat-active').checked = c.active;
            populateParentDropdown(c.parentId || null);
            document.getElementById('modal').classList.add('show');
        } catch (err) {
            console.error(err);
            alertModal({ title: 'Failed to load category' });
        }
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }
    document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.getElementById('form').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('cat-id').value;
        const body = {
            code: document.getElementById('cat-code').value,
            name: document.getElementById('cat-name').value,
            active: document.getElementById('cat-active').checked,
            parentId: document.getElementById('cat-parent').value || null
        };
        if (body.parentId) body.parentId = parseInt(body.parentId);

        try {
            const url = id ? `/asset/classes/${id}` : '/asset/classes';
            const method = id ? 'PUT' : 'POST';
            const res = await apiFetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res || !res.ok) {
                const err = await res.json().catch(() => ({}));
                alertModal({ title: 'Failed to save category', body: err.message });
                return;
            }
            closeModal();
            load();
        } catch (err) {
            console.error(err);
            alertModal({ title: 'Failed to save category' });
        }
    });

    function deleteCat(id) {
        confirmDanger({
            title: 'Delete category?',
            body: 'Child categories will be moved up to this category\'s parent. This cannot be undone.',
            confirmLabel: 'DELETE',
            onConfirm: async () => {
                try {
                    const res = await apiFetch(`/asset/classes/${id}`, { method: 'DELETE' });
                    if (!res) return;
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        alertModal({ title: 'Failed to delete category', body: err.message });
                        return;
                    }
                    load();
                } catch (err) {
                    console.error(err);
                    alertModal({ title: 'Failed to delete category' });
                }
            }
        });
    }

    load();
</script>
</body>
</html>
