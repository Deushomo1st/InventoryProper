<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inbox &mdash; Notification Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
    renderAppShell({
        service: 'Notification',
        page: 'Inbox',
        tabs: [
            { href: '/ui/notification/index.html', label: 'Overview' },
            { href: '/ui/notification/inbox.html', label: 'Inbox' },
            { href: '/ui/notification/templates.html', label: 'Templates' }
        ]
    });
</script>

<main class="page">
    <div class="toolbar">
        <h2>Inbox</h2>
        <select id="status-filter" onchange="loadNotifications()">
            <option value="">All</option>
            <option value="SENT">SENT</option>
            <option value="READ">READ</option>
        </select>
    </div>

    <table class="data-table" id="table">
        <thead>
        <tr>
            <th>When</th>
            <th>Subject</th>
            <th>Body</th>
            <th>Channel</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</main>

<script>
    async function loadNotifications() {
        const status = document.getElementById('status-filter').value;
        const user = getUser();
        const url = '/notification/notifications/me' + (status ? '?status=' + status : '');
        
        try {
            const res = await apiFetch(url);
            if (!res || !res.ok) throw new Error('Failed to load');
            const data = await res.json();
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 32px; color: var(--muted); font-family: var(--mono); font-size: 12px;">No notifications yet</td></tr>';
                return;
            }
            
            data.forEach(n => {
                const timeStr = n.createdAt ? new Date(n.createdAt).toLocaleString() : '&mdash;';
                const bodyPreview = n.body ? (n.body.length > 100 ? n.body.substring(0, 100) + '...' : n.body) : '&mdash;';
                
                let actionCell = '';
                if (n.status === 'SENT') {
                    actionCell = `<button class="action-link" onclick="markRead(${n.id})">MARK READ</button>`;
                } else {
                    actionCell = '<span class="pill active">READ</span>';
                }
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${timeStr}</td>
                    <td>${n.subject || '&mdash;'}</td>
                    <td>${bodyPreview}</td>
                    <td>${n.channel || '&mdash;'}</td>
                    <td><span class="pill">${n.status || 'UNKNOWN'}</span></td>
                    <td><div class="row-actions">${actionCell}</div></td>
                `;
                tbody.appendChild(tr);
            });
        } catch(e) {
            alertModal({title: 'Error', body: e.message});
        }
    }

    async function markRead(id) {
        try {
            const res = await apiFetch(`/notification/notifications/${id}/mark-read`, {method:'POST'});
            if (res && res.ok) loadNotifications();
        } catch(e) {
            alertModal({title: 'Error', body: e.message});
        }
    }

    loadNotifications();
</script>
</body>
</html>
