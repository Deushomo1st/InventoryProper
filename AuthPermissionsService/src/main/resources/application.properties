spring.application.name=AuthPermissionsService
server.port=9001

# Force UTF-8 on all responses (otherwise static HTML serves as Latin-1 and × @ etc. mojibake)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ElectDeptSoftware
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# JWT
security.jwt.secret=Xk9#mP2$vL5nQ8wR3jF6hT1yU4nN7cA0sD9fG2iK5oM8pE3xZ6vW1qJ4rH7tY0uI
security.jwt.expiry-minutes=60
spring.datasource.hikari.maximum-pool-size=3

# Downstream services AuthService calls on privileged actions
# (best-effort calls — failures don't block the primary auth operation)
services.audit.url=http://localhost:9012
services.notification.url=http://localhost:9014
